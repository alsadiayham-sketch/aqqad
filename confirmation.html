<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><link rel="icon" type="image/png" href="logo.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تأكيد الطلب | عقاد كيدز</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin>
    <link rel="dns-prefetch" href="https://firestore.googleapis.com">
    <link rel="dns-prefetch" href="https://images.unsplash.com">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="shared.css">
</head>
<body>
    <div id="navbarMount"></div>
    <main class="page-shell">
        <section class="section">
            <div class="container">
                <div class="confirm-card glass-card" id="confirmationCard" data-animate>
                    <div class="pill-label"><span class="dot"></span>تم تسجيل الطلب بنجاح</div>
                    <h1 style="font-size:clamp(2.2rem,5vw,4rem);margin:18px 0 8px">شكراً لثقتك بعقاد كيدز</h1>
                    <p style="max-width:560px;margin:0 auto;color:var(--muted)">حفظنا طلبك، وسنراجع تفاصيله ثم نتواصل معك في أقرب وقت. احتفظي برقم الطلب للمتابعة السريعة.</p>
                    <div class="stack" id="confirmationSummary" style="margin-top:24px;text-align:right"></div>
                    <div class="action-row" style="justify-content:center;margin-top:24px">
                        <a class="btn btn-primary" id="confirmationWhatsappLink" href="#">إرسال الطلب عبر واتساب</a>
                        <a class="btn btn-secondary" href="index.html">العودة للمتجر</a>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <div id="footerMount"></div>
    <script src="data.js"></script>
    <script src="shared.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            AqqadStore.init({ navSubtitle: 'طلبك أصبح لدينا' });
            AqqadStore.onReady(function () {
                renderConfirmationPage();
            });
        });
        function renderConfirmationPage() {
            var payload = AqqadStore.getLastOrder();
            var summary = document.getElementById('confirmationSummary');
            var link = document.getElementById('confirmationWhatsappLink');
            if (!payload.order) {
                summary.innerHTML = '<div class="notice-card">لا توجد بيانات طلب محفوظة الآن. يمكنك العودة للتسوّق والبدء من جديد.</div>';
                link.href = 'index.html';
                link.textContent = 'العودة للمتجر';
                return;
            }
            var order = payload.order;
            summary.innerHTML = ''
                + '<div class="summary-line notice-card"><span>رقم الطلب</span><strong>' + escapeHtml(order.orderNumber) + '</strong></div>'
                + '<div class="summary-line notice-card"><span>الاسم</span><strong>' + escapeHtml(order.customerName) + '</strong></div>'
                + '<div class="summary-line notice-card"><span>المنطقة</span><strong>' + escapeHtml(order.regionLabel) + '</strong></div>'
                + '<div class="summary-line notice-card"><span>طريقة الدفع</span><strong>' + escapeHtml(order.paymentLabel) + '</strong></div>'
                + '<div class="summary-line notice-card"><span>الإجمالي</span><strong>' + escapeHtml(order.totalFormatted) + '</strong></div>';
            link.href = payload.whatsappUrl || buildWhatsAppUrl(DEFAULT_SITE_SETTINGS.whatsappNumber);
            var query = new URLSearchParams(location.search);
            if (query.get('whatsapp') === '1' && link.href.indexOf('wa.me') >= 0) {
                setTimeout(function () { window.open(link.href, '_blank'); }, 700);
            }
        }
    </script>
</body>
</html>
