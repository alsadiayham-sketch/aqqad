<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><link rel="icon" type="image/png" href="logo.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إتمام الطلب | عقاد كيدز</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin>
    <link rel="dns-prefetch" href="https://firestore.googleapis.com">
    <link rel="dns-prefetch" href="https://images.unsplash.com">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="shared.css">
</head>
<body>
<script>if(window.top!==window.self){window.top.location=window.self.location;}</script>
    <div id="navbarMount"></div>
    <main class="page-shell">
        <section class="section">
            <div class="container stack">
                <div class="section-heading" data-animate>
                    <div>
                        <div class="pill-label"><span class="dot"></span>إتمام الطلب</div>
                        <h2>خطوتك الأخيرة قبل أن يصل الجمال إلى الباب</h2>
                    </div>
                    <p>نفس المنطق السابق للطلب محفوظ، لكن بواجهة أكثر دفئاً ووضوحاً وتفاصيل تساعدك على مراجعة كل شيء بسرعة.</p>
                </div>
                <div id="checkoutContent"></div>
            </div>
        </section>
    </main>
    <div id="footerMount"></div>
    <script src="firebase-config.js"></script>
    <script src="data.js"></script>
    <script src="shared.js"></script>
    <script>
        var checkoutState = { deliveryId: '', paymentMethod: 'cod' };
        var checkoutLoyalty = null;
        document.addEventListener('DOMContentLoaded', function () {
            AqqadStore.init({ navSubtitle: 'إتمام الطلب بسهولة' });
            AqqadStore.onReady(function () {
                renderCheckoutPage();
                fetch('/api/orders?loyalty=1').then(function (r) { return r.json(); }).then(function (d) {
                    checkoutLoyalty = (d && d.loyalty) || null;
                    if (checkoutLoyalty && checkoutLoyalty.enabled) renderCheckoutPage();
                }).catch(function () {});
            });
        });
        function getCheckoutRows() {
            return AqqadStore.getCartDetailed();
        }
        function renderCheckoutPage() {
            var rows = getCheckoutRows();
            var content = document.getElementById('checkoutContent');
            if (!rows.length) {
                content.innerHTML = '<div class="empty-state"><h2>السلة فارغة</h2><p>أضيفي بعض القطع أولاً، ثم عودي لإتمام الطلب.</p><a class="btn btn-primary" href="index.html">العودة للمتجر</a></div>';
                return;
            }
            var deliveryList = getRegionDeliveryList(AqqadStore.state.settings, AqqadStore.state.region);
            if (!checkoutState.deliveryId && deliveryList.length) checkoutState.deliveryId = deliveryList[0].id;
            if (AqqadStore.state.settings.paymentMethods.indexOf(checkoutState.paymentMethod) < 0) checkoutState.paymentMethod = AqqadStore.state.settings.paymentMethods[0] || 'cod';
            var subtotalBase = 0;
            var invalidMessages = [];
            var itemsHtml = rows.map(function (row) {
                if (row.variant && row.availableQty >= row.item.qty) subtotalBase += row.totalBase;
                if (!row.variant || row.availableQty < row.item.qty) {
                    invalidMessages.push('عذراً، المنتج ' + row.product.name + ' مقاس ' + row.item.size + ' لون ' + row.item.color + ' لم يعد متوفراً. يرجى تحديث السلة.');
                }
                return '<div class="checkout-item' + (!row.variant || row.availableQty < row.item.qty ? ' cart-item-invalid' : '') + '"><img src="' + escapeHtml(row.lineImage || row.product.image) + '" alt="' + escapeHtml(row.product.name) + '"><div><strong>' + escapeHtml(row.product.name) + '</strong><div style="color:var(--muted)">' + escapeHtml(row.item.size) + ' • ' + escapeHtml(row.item.color) + ' • الكمية ' + row.item.qty + '</div>' + (!row.variant || row.availableQty < row.item.qty ? '<div class="stock-indicator stock-low">' + escapeHtml(invalidMessages[invalidMessages.length - 1]) + '</div>' : '') + '</div><strong>' + formatCurrency(row.totalBase, AqqadStore.state.region, AqqadStore.state.settings) + '</strong></div>';
            }).join('');
            var selectedDelivery = deliveryList.filter(function (item) { return item.id === checkoutState.deliveryId; })[0] || deliveryList[0];
            var deliveryBase = selectedDelivery ? Number(selectedDelivery.price || 0) : 0;
            var totalBase = subtotalBase + deliveryBase;
            var loyaltyLine = '';
            if (checkoutLoyalty && checkoutLoyalty.enabled && checkoutLoyalty.earnPer > 0) {
                var earnPts = Math.floor(totalBase / checkoutLoyalty.earnPer);
                if (earnPts > 0) loyaltyLine = '<div class="summary-line" style="color:#b8860b"><span>🎁 نقاط الولاء</span><strong>+' + earnPts + ' نقطة</strong></div>';
            }
            var deliveryHtml = deliveryList.map(function (item) {
                return '<button class="option-card ' + (item.id === checkoutState.deliveryId ? 'active' : '') + '" type="button" onclick="selectDelivery(\'' + item.id + '\')"><strong>' + escapeHtml(item.name) + '</strong><div style="color:var(--muted)">' + formatCurrency(item.price, AqqadStore.state.region, AqqadStore.state.settings) + '</div></button>';
            }).join('');
            var paymentHtml = AqqadStore.state.settings.paymentMethods.map(function (method) {
                return '<button class="option-card ' + (method === checkoutState.paymentMethod ? 'active' : '') + '" type="button" onclick="selectPayment(\'' + method + '\')"><strong>' + escapeHtml(getPaymentMethodLabel(method)) + '</strong><div style="color:var(--muted)">' + (method === 'visa' ? 'سيتم التواصل معك لإكمال تفاصيل الدفع.' : 'الدفع عند الاستلام متاح مباشرة.') + '</div></button>';
            }).join('');
            content.innerHTML = (invalidMessages.length ? '<div class="notice-card stock-low" id="checkoutValidationNotice">' + escapeHtml(invalidMessages[0]) + '</div>' : '<div id="checkoutValidationNotice"></div>') + '<div class="checkout-grid"><div class="checkout-card"><h3>مراجعة الطلب</h3><div class="stack">' + itemsHtml + '</div><h3 style="margin-top:22px">منطقة التوصيل</h3><div class="option-cards">' + deliveryHtml + '</div><h3 style="margin-top:22px">طريقة الدفع</h3><div class="option-cards">' + paymentHtml + '</div></div><div class="checkout-card"><h3>بيانات المستلم</h3><div class="stack"><input id="customerName" type="text" placeholder="الاسم الكامل"><input id="customerPhone" type="tel" placeholder="رقم الهاتف"><input id="customerAddress" type="text" placeholder="العنوان الكامل"><textarea id="customerNotes" rows="4" placeholder="ملاحظات إضافية (اختياري)"></textarea></div><div style="margin-top:18px" class="stack"><div class="summary-line"><span>المجموع</span><strong>' + formatCurrency(subtotalBase, AqqadStore.state.region, AqqadStore.state.settings) + '</strong></div><div class="summary-line"><span>التوصيل</span><strong>' + formatCurrency(deliveryBase, AqqadStore.state.region, AqqadStore.state.settings) + '</strong></div><div class="summary-line" style="font-size:1.15rem"><span>الإجمالي</span><strong>' + formatCurrency(totalBase, AqqadStore.state.region, AqqadStore.state.settings) + '</strong></div>' + loyaltyLine + '</div><div class="action-row" style="margin-top:20px"><button class="btn btn-primary" type="button" onclick="submitCheckout()" style="flex:1">تأكيد الطلب</button><a class="btn btn-secondary" href="index.html">العودة للتسوّق</a></div></div></div>';
        }
        function selectDelivery(id) { checkoutState.deliveryId = id; renderCheckoutPage(); }
        function selectPayment(method) { checkoutState.paymentMethod = method; renderCheckoutPage(); }
        function submitCheckout() {
            var name = String(document.getElementById('customerName').value || '').trim();
            var phone = String(document.getElementById('customerPhone').value || '').trim();
            var address = String(document.getElementById('customerAddress').value || '').trim();
            var notes = String(document.getElementById('customerNotes').value || '').trim();
            if (!name || !phone || !address) {
                AqqadStore.showToast('يرجى تعبئة الاسم والهاتف والعنوان.');
                return;
            }
            var deliveryList = getRegionDeliveryList(AqqadStore.state.settings, AqqadStore.state.region);
            var delivery = deliveryList.filter(function (item) { return item.id === checkoutState.deliveryId; })[0] || deliveryList[0];
            if (!delivery) {
                AqqadStore.showToast('يرجى اختيار منطقة توصيل.');
                return;
            }
            var rows = getCheckoutRows();
            var invalidRows = rows.filter(function (row) {
                return !row.variant || row.availableQty < row.item.qty;
            });
            if (invalidRows.length) {
                for (var i = 0; i < invalidRows.length; i += 1) {
                    AqqadStore.removeCartLine(invalidRows[i].product.id, invalidRows[i].item.size, invalidRows[i].item.color);
                }
                AqqadStore.showToast('عذراً، تم تحديث السلة بعد نفاد بعض القطع من المخزن.');
                var firstInvalid = invalidRows[0];
                document.getElementById('checkoutValidationNotice').innerHTML = escapeHtml('عذراً، المنتج ' + firstInvalid.product.name + ' مقاس ' + firstInvalid.item.size + ' لون ' + firstInvalid.item.color + ' لم يعد متوفراً. يرجى تحديث السلة.');
                renderCheckoutPage();
                return;
            }
            var subtotalBase = 0;
            var items = rows.map(function (row) {
                subtotalBase += row.totalBase;
                return {
                    productId: row.product.id,
                    name: row.product.name,
                    brand: row.product.brand,
                    type: row.product.type,
                    size: row.item.size,
                    color: row.item.color,
                    qty: row.item.qty,
                    unitPriceBase: row.pricing.finalBase,
                    lineTotalBase: row.totalBase,
                    image: row.lineImage || row.product.image
                };
            });
            var orderNumber = makeOrderId();
            var totalBase = subtotalBase + Number(delivery.price || 0);
            var payload = {
                orderNumber: orderNumber,
                customerName: name,
                phone: phone,
                address: address,
                notes: notes,
                items: items,
                itemsCount: items.reduce(function (sum, item) { return sum + item.qty; }, 0),
                subtotalBase: subtotalBase,
                deliveryBase: Number(delivery.price || 0),
                totalBase: totalBase,
                totalFormatted: formatCurrency(totalBase, AqqadStore.state.region, AqqadStore.state.settings),
                region: AqqadStore.state.region,
                regionLabel: getRegionLabel(AqqadStore.state.region),
                deliveryId: delivery.id,
                deliveryName: delivery.name,
                paymentMethod: checkoutState.paymentMethod,
                paymentLabel: getPaymentMethodLabel(checkoutState.paymentMethod),
                status: 'new',
                statusLabel: getOrderStatusLabel('new'),
                conversionRate: AqqadStore.state.settings.conversionRate,
                createdAtIso: new Date().toISOString(),
                updatedAtIso: new Date().toISOString()
            };
            var whatsappMessage = AqqadStore.buildOrderWhatsappMessage(payload);
            var saved = { order: payload, whatsappUrl: buildWhatsAppUrl(AqqadStore.state.settings.whatsappNumber, whatsappMessage) };
            AqqadStore.createOrder(payload, function () {
                AqqadStore.saveLastOrder(saved);
                AqqadStore.clearCart();
                if (checkoutState.paymentMethod === 'cod') {
                    location.href = 'confirmation.html?order=' + encodeURIComponent(orderNumber) + '&whatsapp=1';
                } else {
                    location.href = 'confirmation.html?order=' + encodeURIComponent(orderNumber);
                }
            }, function (message) {
                AqqadStore.showToast(message);
            });
        }
    </script>
</body>
</html>
